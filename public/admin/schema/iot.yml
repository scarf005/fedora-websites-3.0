  ####################
  # Fedora IOT Pages #
  ####################
  - label: "IOT Pages"
    label_singular: "IOT Page"
    name: "iotPage"
    folder: "/content/pages/edtions/iot"
    format: "yml"
    slug: "{{slug}}"
    identifier_field: name
    editor:
      preview: true
    nested:
      depth: 5
    fields:
      - { label: "Page Title", name: "title", widget: "string", required: false }
      - { label: "Page Description", name: "description", widget: "text", required: false }
      - label: "Page Sections"
        name: "sections"
        widget: "list"
        collapsed: true
        fields:
          - { label: "Header Title", name: "sectionTitle", widget: "string", required: false, }
          - label: "Lists"
            name: "list"
            widget: "list"
            collapsed: false
            fields:
              - { label: "Title", name: "title", widget: "string", required: false }
              - { label: "Description", name: "description", widget: "string", required: false }
              - { label: "Image", name: "image", widget: "image", required: false }
