backend:
  name: gitlab
  repo: fedora/websites-apps/fedora-websites/fedora-websites-3.0
  accept_roles:
    - admin
    - editor
  # Do more research on https://www.netlifycms.org/docs/gitlab-backend/
  auth_type: pkce # Required for pkce
  app_id: 758719d1c68529b4acc2f2f3556cad1a8bba916f63094fc377afcb31d25bf349 # Application ID from your GitLab settings
  branch: cms-rewrite
  squash_merges: true
publish_mode: editorial_workflow
# Deploy Preview Links Docs: https://www.netlifycms.org/docs/deploy-preview-links/
#show_preview_links: true

# Assets
media_folder: "public/assets/images"
public_folder: "public/assets/images"

collections:
  #################
  # Flock Pages #
  ################
  - label: "Flock Pages"
    label_singular: "Flock Page"
    name: "flockPage"
    folder: "/content/pages"
    format: "yml"
    slug: "{{slug}}"
    identifier_field: name
    editor:
      preview: true
    nested:
      depth: 5
    fields:
      - { label: "Page Title", name: "title", widget: "string", required: false }
      - { label: "Page Description", name: "description", widget: "text", required: false }
      - label: "Page Sections"
        name: "sections"
        widget: "list"
        collapsed: true
        fields:
          - { label: "Header Title", name: "sectionTitle", widget: "string", required: false, }
          - label: "Lists"
            name: "list"
            widget: "list"
            collapsed: false
            fields:
              - { label: "Title", name: "title", widget: "string", required: false }
              - { label: "Description", name: "description", widget: "string", required: false }
              - { label: "Image", name: "image", widget: "image", required: false }
  ####################
  # Fedora IOT Pages #
  ####################
  - label: "IOT Pages"
    label_singular: "IOT Page"
    name: "iotPage"
    folder: "/content/pages/edtions/iot"
    format: "yml"
    slug: "{{slug}}"
    identifier_field: name
    editor:
      preview: true
    nested:
      depth: 5
    fields:
      - { label: "Page Title", name: "title", widget: "string", required: false }
      - { label: "Page Description", name: "description", widget: "text", required: false }
      - label: "Page Sections"
        name: "sections"
        widget: "list"
        collapsed: true
        fields:
          - { label: "Header Title", name: "sectionTitle", widget: "string", required: false, }
          - label: "Lists"
            name: "list"
            widget: "list"
            collapsed: false
            fields:
              - { label: "Title", name: "title", widget: "string", required: false }
              - { label: "Description", name: "description", widget: "string", required: false }
              - { label: "Image", name: "image", widget: "image", required: false }
  #######################
  # Fedora Server Pages #
  #######################
  - label: "Server Pages"
    label_singular: "Server Page"
    name: "server-page"
    folder: "/content/pages/editions/server"
    format: "yml"
    slug: "{{slug}}"
    identifier_field: name
    editor:
      preview: true
    nested:
      depth: 5
    fields:
      - { label: "Page Title", name: "title", widget: "string", required: false }
      - { label: "Page Description", name: "description", widget: "text", required: false }
      - label: "Page Sections"
        name: "sections"
        widget: "list"
        collapsed: true
        fields:
          - { label: "Header Title", name: "sectionTitle", widget: "string", required: false, }
          - label: "Lists"
            name: "list"
            widget: "list"
            collapsed: false
            fields:
              - { label: "Title", name: "title", widget: "string", required: false }
              - { label: "Description", name: "description", widget: "string", required: false }
              - { label: "Image", name: "image", widget: "image", required: false }
  ###############
  # Start Page #
  ##############
  - label: "Start Pages"
    label_singular: "Start Page"
    name: "startPage"
    folder: "/content/pages/"
    format: "yml"
    slug: "{{slug}}"
    identifier_field: name
    editor:
      preview: true
    nested:
      depth: 5
    fields:
      - { label: "Page Title", name: "title", widget: "string", required: false }
      - { label: "Page Description", name: "description", widget: "text", required: false }
      - label: "Page Sections"
        name: "sections"
        widget: "list"
        collapsed: true
        fields:
          - { label: "Header Title", name: "sectionTitle", widget: "string", required: false, }
          - label: "Lists"
            name: "list"
            widget: "list"
            collapsed: false
            fields:
              - { label: "Title", name: "title", widget: "string", required: false }
              - { label: "Description", name: "description", widget: "string", required: false }
              - { label: "Image", name: "image", widget: "image", required: false }
  #####################
  # Workstation Pages #
  #####################
  - name: "workstation" # Used in routes, e.g., /admin/collections/blog
    label: "Workstation Pages" # Used in the UI
    label_singular: "Workstation Page"
    folder: "/content/editions/workstation" # The path to the folder where the documents are stored
    format: "yml"
    slug: "{{slug}}" # Filename template, e.g., YYYY-MM-DD-title.md
    identifier_field: name
    create: true
    editor:
      preview: true
    nested:
      depth: 5
    fields: # The fields for each document, usually in front matter
      - {
          label: "Path",
          name: "path",
          widget: "string",
          hint: "URL Name of the page, Not Visible on the Page",
        }
      - {
          label: "Page Title",
          name: "title",
          widget: "string",
          hint: "Main headline and h1 tag on the web page",
        }
      - {
          label: "Page Description",
          name: "description",
          widget: "text",
          hint: "Page header description text",
          required: false
        }
      - {
          label: "Header Images",
          name: "header_images",
          widget: "image",
          allow_multiple: true,
          hint: "Add background and foreground images to the header",
          required: false
        }
      - label: "Page Sections"
        label_singular: "Page Section"
        name: "sections"
        hint: "Main sections of page content, generally grouped by h2 headings"
        summary: "Page Section"
        widget: "list"
        collapsed: true
        fields:
          - {
              label: "Section Title",
              name: "sectionTitle",
              widget: "string",
              hint: "A headline title for a section of content (probably an h2)",
            }
          - {
              label: "Section Description",
              name: "sectionDescription",
              widget: "markdown",
              hint: "Longer text that accompanies the title",
              required: false
            }
          - { label: "Section Images",
              singular_label: "image",
              name: "images",
              widget: "image",
              required: false
            }
          - label: "Section Content"
            name: "content"
            widget: "list"
            hint: "Add sub sections, cards, and lists of content here."
            collapsed: false
            fields:
              - { label: "Title", name: "title", widget: "string", required: false }            
              - { label: "description", name: "description", widget: "markdown", required: false }
              - { label: "Image", name: "image", widget: "image", required: false }
              - label: "Link"
                name: "link"
                widget: "object"
                fields:
                  - { label: "Link Text", name: "text", widget: "string", hint: "Visible text for a link or button", required: false }
                  - { label: "Link URL", name: "url", widget: "string", hint: "URL path for the link or button", required: false }

