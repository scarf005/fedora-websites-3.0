#################
# Release Data #
#################

- label: "Release Information"
  name: "release"
  files:
    - label: "Fedora Linux Release Data"
      name: "releaseData"
      file: "/content/release.yml"
      format: yml
      fields:
        - label: "Download Base URL"
          name: "download_baseurl"
          widget: "string"
          required: true
        - label: "General Availability"
          name: "ga"
          summary: "Information about GA release"
          widget: "object"
          collapsed: false
          fields:
            - label: "Major release version"
              name: "releasever"
              widget: "number"
              value_type: "int"
              required: true
            - label: "Release Candidate version"
              name: "rc_version"
              widget: "string"
              required: true
            - label: "Fedora Magazine announcement post"
              name: "announcement_url"
              widget: "string"
            - label: "Workstation Artefacts"
              name: "workstation"
              widget: "object"
              collapsed: true
              fields:
                - label: "x86_64 Architecture"
                  name: "x86_64"
                  widget: "object"
                  collapsed: false
                  fields:
                    - label: "Arch Title"
                      name: "title"
                    - label: "Artefacts List"
                      name: "items"
                      widget: "list"
                      collapsed: true
                      fields:
                        - label: "Artifact name"
                          name: "name"
                        - label: "Artifact URI"
                          name: "uri"
                - label: "aarch64 Architecture"
                  name: "aarch64"
                  widget: "object"
                  collapsed: true
                  fields:
                    - label: "Arch Title"
                      name: "title"
                    - label: "Artefacts List"
                      name: "items"
                      widget: "list"
                      collapsed: true
                      fields:
                        - label: "Artifact name"
                          name: "name"
                        - label: "Artifact URI"
                          name: "uri"
        - label: "Beta Availability"
          name: "beta"
          summary: "Information about BETA release"
          widget: "object"
          collapsed: false
          fields:
            - label: "Display beta download"
              name: "enabled"
              widget: "boolean"
              required: true
            - label: "Major release version"
              name: "releasever"
              widget: "number"
              value_type: "int"
              required: true
            - label: "Release Candidate version"
              name: "rc_version"
              widget: "string"
              required: true
            - label: "Workstation Artefacts"
              name: "workstation"
              widget: "object"
              collapsed: true
              fields:
                - label: "x86_64 Architecture"
                  name: "x86_64"
                  widget: "object"
                  collapsed: false
                  fields:
                    - label: "Artefacts List"
                      name: "items"
                      widget: "list"
                      collapsed: true
                      fields:
                        - label: "Artifact name"
                          name: "name"
                        - label: "Artifact URI"
                          name: "uri"
                - label: "aarch64 Architecture"
                  name: "aarch64"
                  widget: "object"
                  collapsed: true
                  fields:
                    - label: "Artefacts List"
                      name: "items"
                      widget: "list"
                      collapsed: true
                      fields:
                        - label: "Artifact name"
                          name: "name"
                        - label: "Artifact URI"
                          name: "uri"
    # Compliance Partial Data
    - label: "Download Terms and Conditions Partial"
      name: "compliancePartial"
      file: "/content/partials/compliance.yml"
      format: yml
      fields:
        - label: "Title"
          name: "title"
          required: false
          hint: "Section title"
        - label: "Description"
          name: "description"
          required: false
          widget: "text"
          hint: "Section content"
    # Become Contributors Partial Data
    - label: "Become Contributor Partial"
      name: "becomeContributorPartial"
      file: "/content/partials/become_contributor.yml"
      format: yml
      fields:
        - label: "Title"
          name: "sectionTitle"
          required: false
          hint: "Section Title"
        - label: "Description"
          name: "sectionDescription"
          required: false
          hint: "An optional description"
        - label: "Official Channels"
          name: "officialChannels"
          widget: "object"
          collapsed: true
          fields:
            - label: "Section Title"
              name: "title"
              required: false
              hint: "An optional headline"
            - label: "List of channels"
              name: "content"
              required: false
              widget: "list"
              collapsed: true
              fields:
                - label: "Name"
                  name: "title"
                  required: false
                  hint: "Communication channel name"
                - label: "Image"
                  name: "image"
                  required: false
                  hint: "An optional image or logo"
                - label: "Link URL"
                  name: "link"
                  required: false
                  hint: "An optional URL"
        - label: "Community Channels"
          name: "communityChannels"
          widget: "object"
          collapsed: true
          fields:
            - label: "Section Title"
              name: "title"
              required: false
              hint: "An optional headline"
            - label: "List of channels"
              name: "content"
              required: false
              widget: "list"
              collapsed: true
              fields:
                - label: "Name"
                  name: "title"
                  required: false
                  hint: "Communication channel name"
                - label: "Image"
                  name: "image"
                  required: false
                  hint: "An optional image or logo"
                - label: "Link URL"
                  name: "link"
                  required: false
                  hint: "An optional URL"
