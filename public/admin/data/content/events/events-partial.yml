title: Events
description: Fedora has events throughout the year that you can attend,
  typically in-person or virtually, to learn more about Fedora Workstation as
  well as meet other users and contributors.
Notification: In-person Flock events are currently on-hold due to the ongoing COVID pandemic.
logo:
  image: public/assets/images/colur-sign.png
  text: Colúr (cuh-loohr) is our Flock mascot.
media:
  image: public/assets/images/presentation-thumbnail.png
  text: Check out the recap from our Fedora 37 release party!
  url: https://www.youtube.com/watch?app=desktop&v=cZKzkzH27GY
cards:
  - eventTitle: The Annual Fedora Project Conference
    eventDescription: >-
      Flock is the Fedora Project's annual multi-day **in-person** conference
      focused on our contributors. It typically alternates between European and
      North American locations. The conference provides a venue for face-to-face
      meetings and conversations. It is also a place to celebrate our
      community. 


      **Flock typically takes place every August.**
    logo: public/assets/images/flock-two-colour-gradient-navy.png.png
    url: https://flocktofedora.org
  - eventTitle: The Virtual Fedora Project Conference
    eventDescription:
      Nest is our at-home, virtual Flock that has been running since
      the global outbreak of COVID-19.  It takes place over 3 days and includes
      talks, workshops, hackfests, and social events.
    logo: public/assets/images/nest-dual-colour-navy.png.png
    url: https://flocktofedora.org
  - eventTitle: Worldwide & Local Fedora Meetups
    eventDescription: Hatch is a series of small-scale, in-person global meetups
      organized in the weeks preceding the Flock / Nest conference enabling
      Fedorans local to each other to meet.
    logo: public/assets/images/hatch.png
    url: https://flocktofedora.org
