image: fedora:latest

before_script:
  - mkdir -p .cache_dnf && mkdir -p /var/cache/dnf && mount --bind .cache_dnf /var/cache/dnf
  - dnf install npm -y

cache:
  paths:
    - node_modules/
    - .cache_dnf

variables:
  GIT_SUBMODULE_STRATEGY: normal
  GIT_SUBMODULE_FORCE_HTTPS: "true"

stages:
  - build
  - test
  - deploy

gen_locales:
  stage: build
  script:
    - git checkout -b l10n_update
    - git remote set-url --push origin http://ci-git-token:${CI_GIT_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git
    - cd locales.build.d
    - ./genLocale.py ../content/ --all
    - ./merge.py
    - cd ..
    - git add cms_content ../locales/en.json
    - git status
    - |-
      CHANGES=$(git status --porcelain | wc -l)
      if [ "$CHANGES" -gt "0" ]; then
        git config user.email "${GITLAB_USER_EMAIL}"
        git config user.name "${GITLAB_USER_NAME}"
        git commit -m "[skip-ci] Update l10n files"
        git push -o ci-skip origin l10n_update:${CI_COMMIT_REF_NAME}
      fi
  rules:
    - if: $CI_COMMIT_BRANCH == "develop" && $CI_PROJECT_ROOT_NAMESPACE == "fedora"
      when: always
    - when: never

pages:
  stage: build
  script:
    - npm install
    - npm run generate
    - rm -rf ./public
    - mv .output/public ./public
  artifacts:
    expire_in: 1 day # unless marked as keep from job page
    paths:
      - public
  needs:
  - gen_locales
  only:
    - develop # only build develop branch to test deploy. Feature branches are not built, main is hosted on Fedora CDN.
  interruptible: true

build_preview:
  stage: build
  script:
    - npm install
    - npm run generate
    - rm -rf ./public
    - mv .output/public ./public
  variables:
    CI_PAGES_URL: https://${CI_SERVER_HOST}/${CI_PROJECT_PATH}/-/jobs/${CI_JOB_ID}/artifacts/public
    CI_FAST_BUILD: "true"
  artifacts:
    paths:
      - public/
    expire_in: 1 day
    expose_as: "build preview"
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
  environment:
    name: preview MR_${CI_MERGE_REQUEST_IID}
    url: https://${CI_SERVER_HOST}/${CI_PROJECT_PATH}/-/jobs/${CI_JOB_ID}/artifacts/file/public/index.html
    auto_stop_in: 1 week
