image: fedora:latest

before_script:
  - dnf install npm translate-toolkit git -y 

cache:
  paths:
    - node_modules/
    - /var/cache/dnf

pages:
  script:
    - npm install
    - ./i18n_gen_yml.sh # run at build time to create temporary yml files from weblate po files.
    - npm run generate
    - rm -rf ./public
    - mv .output/public ./public
  artifacts:
    expire_in: 1 day # unless marked as keep from job page
    paths:
      - public
  only:
    - develop # only build develop branch to test deploy. Feature branches are not built, main is hosted on Fedora CDN.



update_pos_if_yaml_changed:
  script:
    - git config --global user.name "${GITLAB_USER_NAME}"
    - git config --global user.email "${GITLAB_USER_EMAIL}"
    - ./i18n_gen_pot.sh # run whenever changes to /content. create/update the pot files used by weblate.
    - ./i18n_update_po.sh # update the po files from the up-to-date pot files
    - git add .
      # "[ci skip]" and "-o ci-skip" prevent a CI trigger loop
    - git commit -m "[ci skip] AUTOMATA - update .pot and .po files $CURRENTDATE"
    - git push -o ci-skip http://root:$ACCESS_TOKEN@$CI_SERVER_HOST/$CI_PROJECT_PATH.git HEAD:develop     
  artifacts:
    expire_in: 1 day # unless marked as keep from job page
  only:
    - develop # only build develop branch to test deploy. Feature branches are not built, main is hosted on Fedora CDN.