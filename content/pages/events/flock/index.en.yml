title: Flock To Fedora
description: Flock to Fedora is the annual contributor conference for the Fedora
  Project. It has a virtual version called Nest.
header:
  logo: public/assets/images/flock_logo_barcelona.png
  subtitle:
    text: The Fedora Project Conference
    color: fp-blue
    isBold: true
  eventDate: August 5 - 7, 2023
  images:
    backgroundImage: public/assets/images/flock_background.jpg
  cta:
    - text: Register
      url: "#"
    - text: Calendar
      url: "#"
  cards:
    - image: public/assets/images/flock_nest_logo.png
      subtitle: Virtual
      description: A 3 day conference hosted on Hopin.io
    - image: public/assets/images/flock_hatch_logo.png
      subtitle: Community
      description: Community events hosted around the world
section:
  - header:
      sectionTitle: We are Fedora
      headerImage:
        image: public/assets/images/iot_flock_background.jpg
      subtitle1: The Fedora Project envisions a world where everyone can benefit
        from free and open source software built by inclusive, welcoming, and
        open-minded communities.
    content:
      list:
        - title: Discussions
          description:
            Use our messaging board Fedora Discussions to stay up to date on Flock
            Notifications. <b><a href="https://discussion.fedoraproject.org/">Check is out here</a></b>.
        - title: Twitter
          description:
            'Use the <b>#NestWithFedora</b> hashtags on your preferred social media platforms.
            Follow <b><a href="https://twitter.com/fedora">@fedora</a></b> on Twitter for updates.'
        - title: Matrix & IRC
          description:
            'Our main IRC channel for the event is <b>#fedora-flock</b> on <b>libera.chat</b>.
            Join <b><a href="https://web.libera.chat/?channels=#fedora-flock">#fedora-flock</a></b> to chat on Matrix or IRC.'
        - title: Ask Fedora
          description:
            New to Fedora? Check our <b><a href="https://ask.fedoraproject.org/">community forum</a></b> for support and help with
            frequently asked questions.

  - header:
      sectionTitle: Benefits of Sponsoring Flock
    content:
      list:
        - title: Brand Exposure
          description:
            Sponsors are advertised in several places at Flock. We also post about
            sponsors on social media. Your brand will be distributed globally in
            our swag bag.
        - title: Spotlight
          description:
            Our tierd sponsorship levels will all give you great visibility at Flock.
            Your booth will be showcased on the Expo page to maximize engagement.
        - title: Networking
          description:
            Flock attracts hundreds of amazing open source community members who work
            on and use software daily. Engage with our vibrant community in sessions
            and social hours.
        - title: Booths
          description:
            All sponsor booths include a video, customizable experience, chat, and 
            social media engagement. Click below to learn more.
exploreSection:
  cards:
  - title: Workshops
    imageURI: public/assets/images/flock_workshops_logo.png
    description: 
      Workshops and hackfests offer opportunities for active learning and collaboration.
    link:
      text: View Projects
      targetURL: ""
  - title: Sessions
    imageURI: public/assets/images/flock_sessions_logo.png
    description: 
      Presentations that showcase the work done in Fedora and planning for the future.
    link:
      text: View Topics
      targetURL: ""
  - title: Social Events
    imageURI: public/assets/images/flock_socialevents_logo.png
    description: 
      Casual, facilitated, and interactive events for meeting and socializing with Fedorans.
    link:
      text: View Socials
      targetURL: ""
