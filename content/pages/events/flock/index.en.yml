title: Flock To Fedora
description: Flock to Fedora is the annual contributor conference for the Fedora
  Project. It has a virtual version called Nest.
header:
  logo: public/assets/images/flock-barcelona.png
  subtitle:
    text: The Fedora Project Conference
    color: fp-blue
    isBold: true
  eventDate: August 5 - 7, 2023
  images:
    backgroundImage: public/assets/images/fedora-33-night.jpg
  cta:
    - text: Register
      url: "#"
    - text: Calendar
      url: "#"
  cards:
    - image: public/assets/images/nest-white-logo.png
      subtitle: Virtual
      description: A 3 day conference hosted on Hopin.io
    - image: public/assets/images/hatch-white-logo.png
      subtitle: Community
      description: Community events hosted around the world
section:
  - header:
      sectionTitle: We are Fedora
      headerImage:
        image: public/assets/images/iot_flock_background.jpg
      subtitle1: The Fedora Project envisions a world where everyone can benefit
        from free and open source software built by inclusive, welcoming, and
        open-minded communities.
    content:
      list:
        - title: Discussions
          description:
            Use our messaging board Fedora Discussions to stay up to date on Flock
            Notifications. Check is out here.
        - title: Twitter
          description:
            'Use the #NestWithFedora hashtags on your preferred social media platforms.
            Follow @fedora on Twitter for updates.'
        - title: Matrix & IRC
          description:
            'Our main IRC channel for the event is #fedora-flock on libera.chat.
            Join #fedora-flock to chat on Matrix or IRX.'
        - title: Ask Fedora
          description:
            New to Fedora? Check our community forum for support and help with
            frequently asked questions.

