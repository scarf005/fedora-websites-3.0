section:
- content:
    list:
    - description: Każda wersja jest aktualizowana przez 18 miesięcy, a aktualizacje
        między wersjami są szybkie i proste.
      title: Niezawodna
    - description: Z Fedorą Twój komputer należy do Ciebie. Jest bezpłatna, bez reklam,
        a Twoje dane należą do Ciebie.
      title: Wolna i prywatna
    - description: Wydanie Workstation jest starannie opracowywane, aby zapewniać
        wysoką jakość. Pulpit jest czysty i niezaśmiecony.
      title: Piękna
    - description: Rozwijana w porozumieniu z projektami nadrzędnymi. Rygorystycznie
        testowana. Wspierana przez firmę Red Hat.
      title: Zaufana
    - description: Zbudowana za pomocą najnowszych technologii i ulepszeń, jakie oferuje
        oprogramowanie open source.
      title: Wiodąca technologia
    - description: Fedora współpracuje z producentami sprzętu, aby obsługiwać jak
        najwięcej urządzeń każdego rodzaju.
      title: W pełni wykorzystuje Twoje urządzenie
  header:
    sectionTitle: Dlaczego warto wybrać Fedorę Workstation?
- content:
    list:
    - description: Przeglądaj obszerną kolekcję aplikacji, zapewniającą wszystko,
        czego możesz potrzebować. Zawiera ekscytujące nowe aplikacje open source,
        jak również aplikacje znane z innych systemów.
      title: Fantastyczne aplikacje
    - description: Dzięki globalnej społeczności tłumaczy wydanie Workstation jest
        dostępne w wielu językach.
      title: Workstation mówi w Twoim języku
    - title: Przygaś światła
    - description: Korzystaj z kalendarza internetowego na komputerze za pomocą kont
        online
      title: Integracja z kalendarzem
    - description: Fedora Workstation zawiera wspaniały zestaw narzędzi, takich jak
        zegar światowy, prognoza pogody i mapy.
      title: Od razu przydatna
  header:
    sectionTitle: Korzyści
- content:
    list:
    - title: Zgłoś i dyskutuj błędy
    - title: Porozmawiaj z zespołem
    - title: Dołącz do listy dyskusyjnej
    - title: Weź udział w spotkaniu
  header:
    sectionTitle: Tworzona przez Ciebie
