section:
- content:
    list:
    - description: Każda wersja jest aktualna przez 18 miesięcy, a aktualizacje pomiędzy
        wersjami są szybkie i proste.
      title: Pewny
    - description: Z Fedorą, twój komputer należy do ciebie. Jest darmowy, bez reklamy,
        a twoje dane należą do ciebie.
    - description: Wersja Workstation jest uważne dopracowana by dostarczyć wysokie
        jakości doświadczenia. System jest czysty i nie zagracony.
      title: Piękny
    - description: Rozwijany w partnerstwie projektów nadrzędnych. Restrykcyjnie testowany.
        Poparty przez Red Hat.
      title: Godny zaufania
    - description: Zbudowany na najnowszych technologiach i poprawkach oferowanych
        przez wolne oprogramowanie.
      title: Technologia wiodąca
    - description: Fedora pracuje z producentami sprzętu komputerowego by zapewnić
        wspaniałe wsparcie dla wielu urządzeń.
      title: Pokazuje pełną moc twojego urządzenia
  header:
    sectionTitle: Dlaczego warto wybrać Fedora Workstation?
- content:
    list:
    - description: Przeglądaj obszerną kolekcje aplikacji, obsługującą wszystko czego
        możesz potrzebować. Zawiera nowe ekscytujące aplikacje otwarto źródłowe jak
        również znajome aplikacje z innych platform.
      title: Fantastyczne Aplikacje
    - description: Dzięki globalnemu społeczeństwu tłumaczy, Workstation jest dostępny
        w wielu językach.
      title: Workstation mówi w twoim języku
  header:
    sectionTitle: Korzyści
