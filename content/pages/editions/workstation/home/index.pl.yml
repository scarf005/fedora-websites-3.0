title: Fedora Workstation
description: Flagowa dystrybucja Projektu Fedora dla komputerów osobistych
header:
  title: Wiodąca dystrybucja Linuksa dla komputerów osobistych
  details:
    - detail: Najnowsze wydanie
    - detail: "36"
    - detail: Informacje o wydaniu<https://getfedora.org>
  cta:
    - text: Pobierz teraz
      url: https://getfedora.org/en/workstation/download/
    - text: Sprawdzone przez TechHut
      url: https://www.youtube.com/watch?v=54aoIGKEMnk
      icon: fa-youtube
  reviewUrl: https://www.youtube.com/results?search_query=fedora+workstation+review
  subtitle:
    text: 
      Piękny, wysokiej jakości system operacyjny zbudowany za pomocą 
      najnowszej technologii open source. Zaufany, o wielu możliwościach, łatwy w obsłudze.
  images:
    image: public/assets/images/workstation_framework.png
    backgroundImage: public/assets/images/workstation_background.jpg
section:
  - header:
      sectionTitle: Dlaczego warto wybrać Fedorę Workstation?
    content:
      list:
        - title: Niezawodna
          description:
            Każda wersja jest aktualizowana przez 18 miesięcy, a aktualizacje
            między wersjami są szybkie i proste.
        - title: Wolna i prywatna
          description:
            Z Fedorą Twój komputer należy do Ciebie. Jest bezpłatna, bez reklam,
            a Twoje dane należą do Ciebie.
        - title: Piękna
          description:
            Wydanie Workstation jest starannie opracowywane, aby zapewniać
            wysoką jakość. Pulpit jest czysty i niezaśmiecony.
        - title: Zaufana
          description:
            Rozwijana w porozumieniu z projektami nadrzędnymi. Rygorystycznie
            testowana. Wspierana przez firmę Red Hat.
        - title: Wiodąca technologia
          description:
            Zbudowana za pomocą najnowszych technologii i ulepszeń, jakie oferuje
            oprogramowanie open source.
        - title: W pełni wykorzystuje Twoje urządzenie
          description:
            Fedora współpracuje z producentami sprzętu, aby obsługiwać jak
            najwięcej urządzeń każdego rodzaju.
  - header:
      sectionTitle: Tworzona przez Ciebie
    content:
      list:
        - title: Fantastyczne aplikacje
          description:
            Przeglądaj obszerną kolekcję aplikacji, zapewniającą wszystko,
            czego możesz potrzebować. Zawiera ekscytujące nowe aplikacje open source,
            jak również aplikacje znane z innych systemów.
          image:
            image: public/assets/images/workstation_outofthebox.png
        - title: Workstation mówi w Twoim języku
          description:
            Dzięki globalnej społeczności tłumaczy wydanie Workstation jest
            dostępne w wielu językach.
          image:
            image: public/assets/images/workstation_outofthebox.png
        - title: Przygaś światła
          description:
            Korzystaj z kalendarza internetowego na komputerze za pomocą kont
            online
          image:
            image: public/assets/images/workstation_languages.png
        - title: Integracja z kalendarzem
          description:
            Fedora Workstation zawiera wspaniały zestaw narzędzi, takich jak
            zegar światowy, prognoza pogody i mapy.
          image:
            image: public/assets/images/workstation_outofthebox.png
        - title: Od razu przydatna
          description:
            Fedora Workstation zawiera wspaniały zestaw narzędzi, takich jak
            zegar światowy, prognoza pogody i mapy.
          image:
            image: public/assets/images/workstation_outofthebox.png
  - header:
      sectionTitle: Built By You
      headerImage:
        image: public/assets/images/iot_flock_background.jpg
      subtitle1: The Fedora Project envisions a world where everyone can benefit
        from free and open source software built by inclusive, welcoming, and
        open-minded communities.
      subtitle2:
        Fedora IoT is created by a team in the Fedora community called the
        IoT Working Group. It is comprised of official members who have decision
        making powers, as well as other contributors. Learn more on the IoT
        Working Group website.
    content:
      text:
        Fedora Workstation is created by a teamm in the Fedora community called
        the **Workstation Working Group**. It is comprised of official members
        who have decision making powers, as well as other contributors. [Learn
        more onthe Workstation Working Group
        Website.](https://docs.fedoraproject.org/en-US/workstation-working-group/)
      list:
        - title: Report & discuss issues
          description:
            You can view, file, and discuss Fedora Workstation issues on [the
            Fedora Workstation issue tracker]().
        - title: Chat with the team
          description:
            Visit **#fedora-workstation** on [irc.libera.chat]() and on
            **#workstation** [on the Fedora Matrix Chat server]().
        - title: Join the mailing list
          description:
            Sign up at [desktop@lists.fedoraproject.org]() to receive meeting
            agendas and minute ([view archives]().)
        - title: Attend a meeting
          description:
            Open to all current and potential contributors on **Tuesdays, 9:30
            AM US Eastern** on [Bluejeans]().
