title: Workstation Community
description: Join a community of users and contributors focused on Fedora Workstation.
section:
  - content:
      text: Fedora Workstation is created by a team in the Fedora Project community
        called the Workstation Working Group. It is comprised of official
        members who have decision-making powers, as well as other contributors.
        Learn more about this group and how you can get involved on the
        Workstation Working Group website.
      card:
        - title: Forum
          cta:
            text: The Fedora Workstation tag on Fedora's Discourse-based discussion forum is
              a great place to connect with other Fedora Workstation users and
              contributors.
