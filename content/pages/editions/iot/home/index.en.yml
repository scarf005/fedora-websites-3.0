  - header:
      sectionTitle: Built By You
      headerImage:
        image: nuxt-site/public/assets/images/iot_flock_background.jpg
      subtitle1: The Fedora Project envisions a world where everyone benefits from
        free and open source software built by inclusive, welcoming, and
        open-minded communities.
      subtitle2: Fedora IoT is created by a team in the Fedora community called the
        IoT Working Group. It is comprised of official members who have decision
        making powers, as well as other contributors. Learn more on the IoT
        Working Group website.
