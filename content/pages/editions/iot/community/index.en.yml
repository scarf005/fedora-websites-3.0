title: "IoT Community "
description: Join a community of users and contributors focused on Fedora IoT.
header:
  title: Community
  subtitle: Join a community of users and contributors focused on Fedora IoT.
section:
  - content:
      text: Fedora IoT is created by a team in the Fedora Project community called the
        IoT Working Group. It is comprised of official members who have
        decision-making powers, as well as other contributors. Learn more about
        this group and how you can get involved on the IoT Working Group
        website.
    header:
      sectionTitle: ""
  - content:
      card:
        - title: Forum
          subtitle: The Fedora IoT tag on Fedora's Discourse-based discussion forum is a
            great place to connect with other Fedora Workstation users and
            contributors.
        - title: Chat
          subtitle: "You can chat with the Fedora IoT Working Group via either Matrix or
            IRC: #iot:fedoraproject.org on Matrix and #fedora-iot on
            irc.libera.chat."
        - title: Mailing List
          subtitle: The Fedora IoT Working Group sends meeting agendas and minutes and has
            discussions on their mailing list at iot@lists.fedoraproject.org.
      text: >-
        Become a Fedora contributor


        Your friendly and helpful contributions to these communication channels would be greatly appreciated! Learn more.
    header:
      sectionTitle: Communication channels
  - header:
      sectionTitle: Ways to get involved
    content:
      card:
        - title: Report & discuss issues
          subtitle: You can view, file, and discuss Fedora IoT issues on the Fedora IoT
            issue tracker.
        - title: Attend a meeting
          subtitle: IoT Working Group meetings are open to all current and potential
            contributors on Wednesdays, 11 AM US Eastern at
            fedora-meeting@irc.libera.chat.
