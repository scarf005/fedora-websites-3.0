title: IoT Community Part 2
description: |
  Join a community of users and contributors focused on Fedora IoT.
header:
  title: Community
  subtitle: Join a community of users and contributors focused on Fedora IoT.
  details:
    - detail: Fedora IoT is created by a team in the Fedora Project community called
        the IoT Working Group. It is comprised of official members who have
        decision-making powers, as well as other contributors. Learn more about
        this group and how you can get involved on [the IoT Working Group
        website](https://docs.fedoraproject.org/en/IoTWG).
section:
  - header:
      sectionTitle: Communication channels
    content:
      card:
        - title: Forum
          subtitle: The Fedora IoT tag on Fedora's Discourse-based discussion forum is a
            great place to connect with other Fedora Workstation users and
            contributors.
          image:
            image: public/assets/images/screenshot-from-2022-09-13-13-40-48.png
            altText: Fedora Discussion logo with chat bubble icons
          cta:
            text: Visit Now
            url: https://discussion.fedoraproject.org/
        - title: Chat
          image:
            image: public/assets/images/iot.png
            altText: A picture!
          subtitle: "You can chat with the Fedora IoT Working Group via either Matrix or
            IRC: #iot:fedoraproject.org on Matrix and #fedora-iot on
            irc.libera.chat."
          cta:
            text: Chat now or forever hold your peace
            url: https://chat.fedoraproject.org
        - title: Mailing list
          subtitle: The Fedora IoT Working Group sends meeting agendas and minutes and has
            discussions on their mailing list at
            **[iot@lists.fedoraproject.org](https://lists.fedoraproject.org/archives/list/iot@lists.fedoraproject.org/)**.
          image:
            image: public/assets/images/flock-barcelona.png
            altText: Flock to Fedora IoT or something
          cta:
            text: Visit now
            url: https://iot.fedoraproject.org/
