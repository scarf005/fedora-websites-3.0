sections:
  - sectionTitle: Going Online
    content:
      - title: Blueberry
        description: Blueberry is a gnome-bluetooth based bluetooth configuration tool which integrates very well in almost any desktop environment.
        image: public/assets/images/spins/blueberry.png
      - title: Firefox
        description: Explore the World Wide Web with Firefox, the full featured web browser.
        image: public/assets/images/spins/firefox.png
      - title: Hexchat
        description: Stay connected with your friends and colleagues using Hexchat, an easy to use IRC client.
        image: public/assets/images/spins/hexchat.png
      - title: Transmission
        description: Are you a downloader? Use Transmission to get new versions of Fedora MATE+Compiz Desktop!
        image: public/assets/images/spins/transmission.png
  - sectionTitle: Utilities & Configuration
    content:
      - title: MATE Terminal
        description: Fedora MATE+Compiz ships a terminal, the gateway to the real power of any UNIX/Linux machine, called MATE Terminal.
        image: public/assets/images/spins/gnome-terminal.png
      - title: DConf Editor
        description: No need to know cryptic commands and config files. Click the options you like to change and choose the settings that make you happy.
        image: public/assets/images/spins/gnome-terminal.png
  - sectionTitle: Office & Productivity Suite
    content:
      - title: LibreOffice
        description: LibreOffice is an integrated office suite. It utilizes free and open standards for its document formats and components.
        image: public/assets/images/spins/libreoffice.png
      - title: Claws Mail
        description: Claws Mail is an easy to configure and full featured email application for the MATE+Compiz Desktop.
        image: public/assets/images/spins/claws-mail.png
  - sectionTitle: Multimedia
    content:
      - title: Exaile
        description: Simple interface. Powerful music management. Smart Playlists. Advanced track tagging. Automatic album art. Lyrics. Streaming Radio. Podcasts.
        image: public/assets/images/spins/exaile.png
      - title: Parole
        description: A modern media player, using gtk3 and the gstreamer plugin framework.
        image: public/assets/images/spins/parole.png
      - title: Eye of MATE
        description: Eye of MATE is meant to be a fast and functional image viewer for the MATE+Compiz Desktop.
        image: public/assets/images/spins/eom.png
      - title: FileZilla
        description: FileZilla is a cross-platform free FTP solution with tons of intuitive tools, helping you to move files quickly between your computer and Web server.
        image: public/assets/images/spins/filezilla.png

