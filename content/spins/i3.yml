sections:
  - sectionTitle: Going Online
    content:
      - title: Firefox
        description: Explore the World Wide Web with Firefox, the full featured web browser.
        image: public/assets/images/spins/firefox.png
      - title: NetworkManager Applet
        description: Just a click and you're connected to your wireless LAN router, or online via many supported 3G mobile broadband cards.
        image: public/assets/images/spins/nm.png
      - title: nmcli
        description: CLI application to control the NetworkManager configuration. It gives you the power of the nm-applet, but in the terminal.
        image: public/assets/images/spins/gnome-terminal.png
  - sectionTitle: Configuration
    content:
      - title: rxvt-unicode
        description: Also known as urxvt, it's a lightweight terminal emulator fully customizable.
        image: public/assets/images/spins/gnome-terminal.png
      - title: brightlight
        description: brightlight gets and sets the screen back-light brightness on Linux systems using the kernel sysfs interface.
        image: public/assets/images/spins/gnome-terminal.png
      - title: azote
        description: A GTK+3-based picture browser and background setter.
        image: public/assets/images/spins/azote.png
  - sectionTitle: Utilities
    content:
      - title: i3lock
        description: Simple screen locker
        image: public/assets/images/spins/gnome-terminal.png
      - title: i3status
        description: Small program for generating a status bar for i3bar, dzen2, xmobar or similar programs
        image: public/assets/images/spins/gnome-terminal.png
      - title: dmenu
        description: Dynamic menu for X11
        image: public/assets/images/spins/gnome-terminal.png
      - title: dunst
        description: Highly-configurable and lightweight notification daemon
        image: public/assets/images/spins/gnome-terminal.png
      - title: htop
        description: Interactive process viewer
        image: public/assets/images/spins/htop.png
      - title: mousepad
        description: Simple text editor for the Xfce desktop environment
        image: public/assets/images/spins/mousepad.png
      - title: Thunar
        description: file manager for Linux and other Unix-like systems
        image: public/assets/images/spins/thunar.png

