title: Fedora Budgie Spin
description: >-
  The Fedora Budgie Spin showcases the Budgie Desktop, a feature-rich, modern desktop designed to keep out the way of the user.
  Budgie Desktop uses common desktop design metaphors while offering uses sophisticated functionality
  such as its Raven widget and notification center, and an approachable method to personalization.


  This Spin is designed to align closely with upstream Budgie Desktop,
  providing a close to vanilla experience with a curated set of default applications that fit in best with Budgie.
