sections:
  - sectionTitle: Going Online
    content:
      - title: Firefox
        description:
          The popular and free web browser backed by Mozilla, a non-profit
          dedicated to internet health and privacy.
        image: public/assets/images/spins/firefox.png
      - title: NetworkManager Applet
        description:
          Just a click and you're connected to your wireless LAN router, or
          online via many supported 3G mobile broadband cards.
        image: public/assets/images/spins/nm.png
      - title: nmcli
        description:
          CLI application to control the NetworkManager configuration. It
          gives you the power of the nm-applet, but in the terminal.
        image: public/assets/images/spins/gnome-terminal.png
  - sectionTitle: Configuration
    content:
      - title: foot
        description: Foot is a fast, lightweight and minimalistic Wayland terminal emulator.
        image: public/assets/images/spins/gnome-terminal.png
      - title: light
        description: light gets and sets the screen back-light brightness on Linux.
        image: public/assets/images/spins/gnome-terminal.png
      - title: imv
        description:
          imv is a command line image viewer intended for use with tiling
          window managers.
        image: public/assets/images/spins/gnome-terminal.png
  - sectionTitle: Utilities
    content:
      - title: sway ock
        description: Simple screen locker.
        image: public/assets/images/spins/gnome-terminal.png
      - title: waybar
        description: Highly customizable Wayland bar for Sway and Wlroots based compositors.
        image: public/assets/images/spins/gnome-terminal.png
      - title: rofi
        description: A window switcher, application launcher and dmenu replacement.
        image: public/assets/images/spins/gnome-terminal.png
      - title: dunst
        description: Highly-configurable and lightweight notification daemon.
        image: public/assets/images/spins/gnome-terminal.png
      - title: kanshi
        description: A Dynamic display configuration tool.
        image: public/assets/images/spins/gnome-terminal.png
      - title: Thunar
        description: File manager for Linux and other Unix-like systems.
        image: public/assets/images/spins/thunar.png
