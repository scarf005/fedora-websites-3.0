title: The Next Generation Operating System
leadin: Surf the web, keep in touch with friends, manage files, enjoy music and video, and get productive at work without having to worry about breaking your system.
description:
  An immutable variant looks, feels, and behaves just like a regular desktop operating system,
  but your updates are delivered as full images of a working system. This makes every installation
  identical to every other, and it will never change while in use. What's more, Kinoite will
  always keep an older version of the system around for you to boot back into, should you need to,
  allowing you to try new programs, desktops, or even complete version upgrades fearlessly!
  <br /><br />
  The immutable design makes a Kinoite system more stable, less prone to bugs, and easier to
  test and develop. Applications are installed via Flatpak completely independent of the base system,
  and CLI tools can utilize the power of containerization with Toolbox.
  <br /><br/>
  Kinoite comes with the popular GNOME desktop and follows the standard 13 month release-cycle,
  making the experience very similar to that of Fedora Workstation.

