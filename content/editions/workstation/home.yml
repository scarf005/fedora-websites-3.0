sections:
  - sectionTitle: Why Fedora Workstation?
    content:
      - title: Reliable
        description: Each version is updated for 18 months, and upgrades between
          versions are quick and easy.
      - title: Free & private
        description:
          With Fedora, your desktop is your own. It's free, there are no ads,
          and your data belongs to you.
      - title: Beautiful
        description: Workstation is carefully curated to deliver a high-quality
          experience. The desktop is clean and uncluttered.
      - title: Trusted
        description:
          Developed in partnership with upstream projects. Rigorously tested.
          Backed by Red Hat.
      - title: Leading technology
        description:
          Built on the latest technologies and enhancements that open source
          has to offer.
      - title: Makes the most of your device
        description:
          Fedora works with hardware vendors to make excellent hardware
          support across a range of devices.
