backend:
  name: gitlab
  repo: fedora/websites-apps/fedora-websites/fedora-websites-3.0
  branch: cms-dev
local_backend: true
# publish_mode: editorial_workflow
# Add Fedora Logo to the UI

display_url: https://fedora.gitlab.io/websites-apps/fedora-websites/fedora-websites-3.0/

# Asset Organization
media_folder: "assets/images"
public_folder: "/images/"

# Collections starter code
collections:
  # File Collection for individual Pages
  - label: "Workstation Edition"
    name: "workstation"
    files:
      - label: "Index Page"
        name: "index"
        file: "content/editions/workstation/index.yml"
        fields:
          - label: "Title"
            name: "title"
            widget: "string" 
      - label: "Download Page"
        name: "download"
        file: "content/editions/workstation/download.yml"
        fields:
          - label: "Title"
            name: "title"
            widget: "string"
  - label: "IoT Edition"
    name: "iot"
    files: 
      - label: "Index Page"
        name: "index"
        file: "content/editions/iot/index.yml"
        fields:
          - label: "Title"
            name: "title"
            widget: "string"
      - label: "Download Page"
        name: "download"
        file: "content/editions/iot/download.yml"
        fields:
          - label: "Title"
            name: "title"
            widget: "string"
  - label: "Server Edition"
    name: "server"
    files: 
      - label: "Index Page"
        name: "index"
        file: "content/editions/server/index.yml"
        fields:
          - label: "Title"
            name: "title"
            widget: "string"
      - label: "Download Page"
        name: "download"
        file: "content/editions/server/download.yml"
        fields:
          - label: "Title"
            name: "title"
            widget: "string"  
  - label: "Editions"
    name: "edition"
    folder: "content/editions"
    create: true
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Publish Date", name: "date", widget: "datetime"}
      - {label: "Featured Image", name: "thumbnail", widget: "image"}
      - {label: "Headline", name: "headline", widget: "string"}