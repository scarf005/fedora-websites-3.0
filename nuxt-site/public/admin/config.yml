backend:
  name: gitlab
  repo: fedora/websites-apps/fedora-websites/fedora-websites-3.0
  auth_type: pkce # Required for pkce
  app_id: 758719d1c68529b4acc2f2f3556cad1a8bba916f63094fc377afcb31d25bf349 # Application ID from your GitLab settings  
  branch: cms-dev
  squash_merges: true
local_backend: true
# publish_mode: editorial_workflow
# Add Fedora Logo to the UI

display_url: https://fedora.gitlab.io/websites-apps/fedora-websites/fedora-websites-3.0/
# Asset Organization
media_folder: "nuxt-site/public/assets/images/"
public_folder: "nuxt-site/public/assets/images/"

# Collections starter code
collections:
  - label: "Pages"
    label_singular: "Page"
    name: "page"
    folder: "nuxt-site/content/pages"
    format: "yml"
    slug: "{{slug}}"
    identifier_field: name
    create: true
    editor:
      preview: false
    nested: 
      depth: 5
    meta: { path: { widget: string, label: 'Path', index_file: 'index' } }
    fields:
      - { label: "Page Title", name: "title", widget: "string", required: false }
      - { label: "Page Description", name: "description", widget: "text", required: false }
      - label: "Page Header"
        name: "header"
        widget: "object"
        collapsed: true
        fields:
          - { label: "Header Title", name: "title", widget: "string", required: false }
          - { label: "Header Subtitle", name: "subtitle", widget: "text", required: false }
          - label: "Extra Details"
            label_singular: "Extra Detail"
            name: "details"
            widget: "list"
            fields:
              - { label: "Detail", name: "detail", widget: "markdown", minimal: true, required: false }
          - label: "Images"
            name: "images"
            widget: "object"
            collapsed: true
            required: false
            fields:
              - { label: "Image", name: "image", widget: "image", required: false}
              - { label: "Image Alt Text", name: "imageAlt", widget: "string", required: false}
              - { label: "Background Image", name: "backgroundImage", widget: "image", required: false}
          - label: "Call to Action"
            name: "cta"
            widget: "list"
            collapsed: true
            required: false
            fields:
              - { label: "Text", name: "text", widget: "string", required: false }
              - { label: "Url", name: "url", widget: "string", required: false }
              - { label: "Icon", name: "icon", widget: "image", required: false }
      # Page Content Section
      - label: "Page Sections"  
        label_singular: "Page Section"
        name: "section"
        widget: "list"
        collapsed: true
        fields:
          # Section Header
          - label: "Section Header"
            name: "header"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Section Heading", name: "sectionTitle", widget: "string", required: false }
              - { label: "Section Subtitle", name: "sectionSubtitle", widget: "text", required: false }
              - label: "Header Image"
                name: "headerImage"
                widget: "object"
                collapsed: true
                required: false
                fields:
                  - { label: "Image", name: "image", widget: "image", required: false }
                  - { label: "Alt Text", name: "altText", widget: "string", required: false }
          # Section Content
          - label: "Section Content"
            name: "content"
            widget: "object"
            collapsed: true
            fields:
              # Nested Content Types
              - label: "List of Info"
                label_singular: "List Item"
                name: "list"
                widget: "list"
                collapsed: true
                required: false
                fields:
                  - { label: "List Item Title", name: "title", widget: "string", required: false }
                  - { label: "List Item Description", name: "description", widget: "markdown", minimal: true, required: false }
                  - label: "List Item Image"
                    name: "image"
                    widget: "object"
                    collapsed: true
                    required: false
                    fields:
                      - { label: "Image", name: "image", widget: "image", required: false }
                      - { label: "Alt Text", name: "altText", widget: "string", required: false }
              - label: "Cards"
                name: "card"
                label_singular: "Card"
                widget: "list"
                required: false
                fields:
                  - { label: "Card Title", name: "title", widget: "string", required: false }
                  - { label: "Card Subtitle", name: "subtitle", widget: "markdown", minimal: true, required: false }
                  - label: "Card Image"
                    name: "image"
                    widget: "object"
                    required: false
                    collapsed: true
                    fields:
                      - { label: "Image", name: "image", widget: "image", required: false }
                      - { label: "Alt Text", name: "altText", widget: "string", required: false }
                  - label: "Card CTA"
                    name: "cta"
                    widget: "object"
                    required: false
                    collapsed: true
                    fields:
                      - { label: "Text", name: "text", widget: "string", required: false }
                      - { label: "Url", name: "url", widget: "string", required: false }
              # Basic Content Types
              - { label: "Section Text", name: "text", widget: "markdown", minimal: true, required: false }
              - label: "Section Image"
                name: "image"
                widget: "object"
                collapsed: true
                required: false
                fields:
                  - { label: "Image", name: "image", widget: "image", required: false }
                  - { label: "Alt Text", name: "altText", widget: "string", required: false }
              - label: "Call to Action"
                name: "cta"
                widget: "list"
                required: false
                fields:
                 - { label: "Text", name: "text", widget: "string" }
                 - { label: "Url", name: "url", widget: "string" }
                 - { label: "Icon", name: "icon", widget: "image", required: false }
          # Section background Image
          - { label: "Background Image", name: "backgroundImage", widget: "image", required: false}
