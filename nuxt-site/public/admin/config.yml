backend:
  name: gitlab
  repo: fedora/websites-apps/fedora-websites/fedora-websites-3.0
  branch: cms-dev
local_backend: true
# publish_mode: editorial_workflow
# Add Fedora Logo to the UI

display_url: https://fedora.gitlab.io/websites-apps/fedora-websites/fedora-websites-3.0/
# Asset Organization
media_folder: "assets/images"
public_folder: "assets/images/"

# Collections starter code
collections:
  # File Collection for individual Pages
  - label: "Workstation Edition"
    name: "workstation"
    files:
      - label: "Index Page"
        name: "index"
        file: "content/editions/workstation/index.yml"
        fields:
          - label: "Title"
            name: "title"
            widget: "string" 
      - label: "Download Page"
        name: "download"
        file: "content/editions/workstation/download.yml"
        fields:
          - label: "Title"
            name: "title"
            widget: "string"
  # IOT Edition Pages
  - label: "IoT Edition"
    name: "iot"
    files: 
      - label: "Index Page"
        name: "index"
        file: "content/editions/iot/index.yml"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Hero Image", name: "heroImage", widget: "image"}
      - label: "Download Page"
        name: "download"
        file: "content/editions/iot/download.yml"
        fields:
          - label: "Title"
            name: "title"
            widget: "string"
  - label: "Server Edition"
    name: "server"
    files: 
      - label: "Index Page"
        name: "index"
        file: "content/editions/server/index.yml"
        fields:
          - label: "Title"
            name: "title"
            widget: "string"
      - label: "Download Page"
        name: "download"
        file: "content/editions/server/download.yml"
        fields:
          - label: "Title"
            name: "title"
            widget: "string"  
  