community:
  text: Built By You
  description: The Fedora Project envisions a world where everyone benefits from
    free and open source software built by inclusive, welcoming, and open-minded
    communities
  working-group: Fedora Workstation is created by a team in the Fedora community
    called the Workstation Working Group. It is comprised of official members
    who have decision making powers, as well as other contributors. Learn more
    on the Workstation Working Group Website
